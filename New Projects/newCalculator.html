<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Simple Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(#969797, rgb(47, 47, 51));
        }

        .calculator {
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 16px;
            background: transparent;
            box-shadow: 0px 3px 15px rgba(0, 0, 0, 0.5);
        }

        input {
            width: 320px;
            border: none;
            border-radius: 8px;
            padding: 24px;
            margin: 10px;
            font-size: 40px;
            text-align: right;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        input::placeholder {
            color: #ffffff;
        }

        button {
            border: none;
            width: 60px;
            height: 60px;
            margin: 10px;
            border-radius: 50%;
            color: #0e0101;
            font-size: 20px;
            font-weight: bolder;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background-color: #ddd;
        }

        .equalBtn {
            background-color: rgb(180, 140, 8);
            color: white;
        }

        .operator {
            color: rgb(2, 49, 16);
            background-color: #f0f0f0;
        }

        .equalBtn:hover {
            background-color: rgb(172, 105, 18);
        }
    </style>
</head>

<body>
    <div class="calculator">
        <input type="text" id="inputBox" placeholder="0" readonly>
        <div>
            <button class="operator">AC</button>
            <button class="operator">DEL</button>
            <button class="operator">%</button>
            <button class="operator">/</button>
        </div>
        <div>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">*</button>
        </div>
        <div>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator">-</button>
        </div>
        <div>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operator">+</button>
        </div>
        <div>
            <button>00</button>
            <button>0</button>
            <button>.</button>
            <button class="equalBtn">=</button>
        </div>
    </div>
    <script>
        let input = document.getElementById('inputBox');
        let buttons = document.querySelectorAll('button');
        let string = "";
        let arr = Array.from(buttons);//[1,2,3,.....]
        arr.forEach(button => {
            button.addEventListener('click', (e) => {
                let val = e.target.innerHTML;
                if (val == '=') {
                    try {
                        input.value = eval(string);
                    } catch {
                        input.value = "Error";
                        string = "";
                    }
                }
                else if (val == 'AC') {
                    input.value = "";
                }
                else if (val == 'DEL') {
                    input.value = string.toString().slice(0, -1);
                }
                else {
                    string += val;
                    input.value = string;
                }
            })
        })
    </script>
</body>

</html>
