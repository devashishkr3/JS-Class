    <script>
        function saveToDB(data, success, failure) {
            let internetSpeed = Math.floor(Math.random() * 10) + 1; //1-10 
            console.log(internetSpeed, data);
            if (internetSpeed > 4) {
                success();
            } else {
                failure();
            }
        }

        saveToDB(

                console.log("Success : Student1 Data is saved.");

                saveToDB(
                    "Sourav", // passing data

                        // sending second data because 1st data is saved in db
                        saveToDB(
                            "Bibhuti", // passing data 
                            () => { // success function for third student

                            },
                            // handling failure for third student
                            () => { // failure function for third student
                                console.log("Failure3 : weak Internet");
                            }
                        );
                    },
                    // handling failure for third student
                    () => { // failure function for second student
                        console.log("Failure2 : weak Internet");
                    }
                );
            },
            // handling failure for third student
            () => { // failure function for first student
                console.log("Failure3 : weak Internet");
            }
        );
