<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <title>Document</title>
      
</head>
<body>
    
    <script>
        let url = "https://fakestoreapi.com/products";

        async function getFacts(){
            let res = await axios.get(url); 
            console.log(res);
            console.log(res.data);//whole array data in res.data(all products list in object under array)
            console.log(res.data[0]);//first product in the list
            console.log(res.data[1]);//second product in the list
            
        }

        getFacts();
    </script>
    
</body>
</html>
