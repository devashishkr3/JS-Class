<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch in JS</title>
    <style>
        /* div{
            height: 100px;
            width: 100px;
            background-color: red;
            border-radius: 50%;

        } */
    </style>
</head>
<body>

    <h1>Random Cat Facts</h1>
    <p>Loding</p>
    
    <script>
        let p = document.querySelector("p");
        let url = "https://catfact.ninja/fact";

        fetch(url)
        .then((res) =>{
            return res.json();
        })
        .then((data) =>{
            console.log(data);
            p.innerText = data.fact;
        })
        .catch((err) =>{
            console.log(err);
        })


        
    </script>
</body>
</html>
