<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Document</title>
</head>

<body>
    <div class="main">
        <div class="navbar">
            <div class="lgo">SKY</div>
            <div class="menu">
                <a href="#">Home</a>
                <a href="#">about</a>
                <a href="#">Gallery</a>
                <a href="#">Contact us</a>
            </div>
            <div class="login"><button id="lbtn">Login</button></div>
        </div>
    </div>
    <div class="sections">
        <section1>
            <div class="main-box">
                <div class="sign">
                    <h2>Sign up</h2>
                    <form>
                        <label for="name">
                            Name
                            <input type="text" placeholder=" Enter your Name                   ☀️" id="name" />
                        </label>
                        <label for="email">
                            Email
                            <input type="email" placeholder="Enter your email                    ✉️ " id="email " />
                        </label>
                        <label for="phone">
                            Mobile no.
                            <input type="number" placeholder="Enter your mobile no.           ☎️" id="phone " />
                        </label>
                        <button id="sbtn">Sign in</button>
                        <label for="check">
                            <input type="checkbox" id="check" />
                            Remember me
                        </label>
                        <div class="login">
                            <p>you already have an account <a href="#">Login</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </section1>
        <section2>
            </hr>
            <div class="main2">
                <div class="login2">
                    <h2>Login</h2>
                    <form>
                        <label for="username">
                            Username
                            <input type="text" placeholder="enter username                      🏤" id="username">
                        </label>
                        <label for="password">
                            Password
                            <input type="password" placeholder="Enter password                      🔒 " id="password ">
                        </label>
                        <div class="forget">
                            <label for="check">
                                <input type="checkbox" id="check">
                                Remember me <a href="#">Forget password?</a></label>
                        </div>
                        <button id="lgbtn">Login</button>
                        <div class="regn">
                            <h5>Don't have an account <a href="#">Register Now</a></h5>
                        </div>
                    </form>
                </div>
            </div>
        </section2>
    </div>
</body>

</html>
